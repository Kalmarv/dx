# dist builds the binaries of a release and attaches them to its GitHub Release (CONTRIBUTING.md, Releasing). After
# changing this file, run `dist generate` (dist 0.34.0) so .github/workflows/release.yml follows.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
installers = []
# ci.yml's release job starts release.yml for each new tag, once release-plz has made its Release (a draft)
dispatch-releases = true
create-release = false
pr-run-mode = "skip"
source-tarball = false

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
