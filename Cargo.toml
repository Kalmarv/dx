[workspace]
resolver = "3"
members = ["d3d9-reader", "dx", "dxbc-reader", "dxcontainer", "dxil-reader", "rsx-reader"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/dx"
publish = true

[workspace.dependencies]
d3d9-reader = { version = "0.4.0", path = "d3d9-reader" }
dxcontainer = { version = "0.4.0", path = "dxcontainer" }
primase-foundations = "0.3.1"
primase-testdata = { version = "0.1.7", git = "https://github.com/Kalmarv/primase-testdata", rev = "8f998f662469da973d06015d14592c894e249a9d" }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
