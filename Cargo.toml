[workspace]
resolver = "3"
members = ["d3d9-reader", "dx", "dxbc-reader", "dxcontainer", "dxil-reader", "rsx-reader", "xtask"]
# its own workspace, built with a nightly toolchain (fuzz/README.md)
exclude = ["fuzz"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/dx"
publish = true

[workspace.dependencies]
d3d9-reader = { version = "0.10.0", path = "d3d9-reader" }
dxcontainer = { version = "0.10.0", path = "dxcontainer" }
primase-foundations = "0.3.1"
primase-testdata = "0.2.4"
# generated inputs for the property tests (tests/properties.rs of each crate); no fork or timeout support, which CI does
# not need
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1

# the profile dist builds the release downloads with
[profile.dist]
inherits = "release"
