[workspace]
resolver = "3"
members = ["dxbc-reader", "dxcontainer", "dxil-reader", "rsx-reader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/dx"
publish = false

[workspace.dependencies]
dxcontainer = { path = "dxcontainer" }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "8dd2fb8caa84eb22b6998655550f1cf288ca6b93" }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
