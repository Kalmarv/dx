[package]
name = "dx"
description = "Command-line tool over the dx readers: Microsoft-dialect disassembly, reflection as JSON and container info for Direct3D shader programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
d3d9-reader.workspace = true
dxbc-reader = { path = "../dxbc-reader" }
dxcontainer.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
