[package]
name = "dx"
description = "Command-line tool over the dx readers: Microsoft-dialect disassembly, reflection as JSON and container info for Direct3D shader programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "dx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
d3d9-reader.workspace = true
dxbc-reader = { path = "../dxbc-reader" }
dxcontainer.workspace = true
dxil-reader = { path = "../dxil-reader" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
primase-testdata.workspace = true

[lints]
workspace = true

[package.metadata.dist]
# not on crates.io (the name is taken), but each release has its binaries
dist = true
