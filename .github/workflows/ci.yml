name: ci
on:
  push:
  pull_request:
env:
  RELEASE_BINS: dx
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
  wasm:
    # the libraries read no files, environment or processes, so they build for a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p d3d9-reader -p dxbc-reader -p dxcontainer -p dxil-reader -p rsx-reader
  plan:
    # a commit that moves a version releases it once every check passed (CONTRIBUTING.md, Releasing)
    needs: [check, wasm]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      crates: ${{ steps.plan.outputs.crates }}
      bins: ${{ steps.plan.outputs.bins }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - id: plan
        run: python3 .github/release.py plan
  binaries:
    needs: [plan]
    if: needs.plan.outputs.bins
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - run: python .github/release.py build ${{ matrix.target }}
        shell: bash
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist
          if-no-files-found: error
  release:
    needs: [plan, binaries]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.plan != '[]'
      && contains(fromJSON('["success", "skipped"]'), needs.binaries.result)
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - if: needs.plan.outputs.bins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - if: needs.plan.outputs.crates
        run: python3 .github/release.py verify
      - if: needs.plan.outputs.crates
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: python3 .github/release.py publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_DIST: ${{ runner.temp }}/dist  # outside the checkout, so cargo publish sees a clean tree
