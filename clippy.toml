allow-unwrap-in-tests = true
allow-expect-in-tests = true

# File, environment and process access. The library crates are pure readers of byte slices: each lib.rs denies these
# (`#![deny(clippy::disallowed_methods, clippy::disallowed_types)]`), so reading a file is the caller's job.
disallowed-methods = [
    { path = "std::fs::read", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::read_to_string", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::read_dir", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::write", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::copy", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::rename", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::create_dir", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::create_dir_all", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::remove_file", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::remove_dir", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::remove_dir_all", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::metadata", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::symlink_metadata", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::canonicalize", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::exists", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::try_exists", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::is_file", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::is_dir", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::metadata", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::read_dir", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::canonicalize", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::absolute", reason = "reads the working directory: callers read files, these crates read bytes" },
    { path = "std::env::var", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::var_os", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::vars", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::current_dir", reason = "configuration comes from the caller, not the environment" },
    { path = "std::process::Command::new", reason = "no processes in library code" },
    { path = "std::fs::exists", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::read_link", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::hard_link", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::set_permissions", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::soft_link", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::os::unix::fs::symlink", reason = "file access: callers read files, these crates read bytes", allow-invalid = true },
    { path = "std::path::Path::read_link", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::path::Path::is_symlink", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::env::args", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::args_os", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::temp_dir", reason = "reads the environment (the temporary folder): callers read files, these crates read bytes" },
    { path = "std::env::home_dir", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::set_current_dir", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::set_var", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::remove_var", reason = "configuration comes from the caller, not the environment" },
    { path = "std::env::vars_os", reason = "configuration comes from the caller, not the environment" },
    { path = "std::process::exit", reason = "no processes in library code" },
    { path = "std::process::abort", reason = "no processes in library code" },
    { path = "std::io::stdin", reason = "configuration comes from the caller, not the environment" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::OpenOptions", reason = "file access: callers read files, these crates read bytes" },
    { path = "std::fs::DirBuilder", reason = "file access: callers read files, these crates read bytes" },
